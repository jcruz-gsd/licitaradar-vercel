<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LicitaRadar — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="app-root"></div>

<script src="/js/app.js"></script>
<script>
// ── Inject layout ───────────────────────────────
document.getElementById('app-root').innerHTML = `
<div class="app">
  ${sidebarHTML()}
  <div class="main">
    ${topbarHTML()}
    <div class="content">
      <div class="page-header">
        <div>
          <div class="page-title" id="greeting">Buenos días</div>
          <div class="page-sub">Resumen de licitaciones tecnológicas de Mercado Público Chile</div>
        </div>
        <button class="btn btn-primary" id="btn-scan-top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Escanear ahora
        </button>
      </div>

      <div id="scan-alert" class="alert" style="display:none;"></div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        ${statSkeleton(4)}
      </div>

      <!-- Chart + Scan card -->
      <div class="two-col" style="margin-bottom:16px;">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Actividad — últimos 30 días</span>
          </div>
          <div class="card-body" style="height:220px;position:relative;">
            <canvas id="activity-chart"></canvas>
          </div>
        </div>

        <div class="card" style="background:linear-gradient(160deg,#0F1B35,#162d5e);">
          <div class="card-body" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:24px;">
            <div>
              <div style="font-size:11px;font-weight:700;color:rgba(0,196,212,.9);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Escaneo automático</div>
              <div style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1.2;margin-bottom:10px;">
                3 veces<br>al día
              </div>
              <div style="font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;">
                Lunes a viernes, 9:00 · 13:00 · 17:00 hrs.<br>
                Notificaciones automáticas por correo.
              </div>
            </div>
            <div>
              <div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:8px;">Próximo escaneo</div>
              <div style="font-size:18px;font-weight:700;color:#00C4D4;" id="next-scan">Calculando…</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent table -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Últimas licitaciones detectadas</span>
          <a href="/historial.html" class="btn btn-outline" style="font-size:12px;padding:6px 12px;">Ver todas →</a>
        </div>
        <div id="recent-table">
          <div style="padding:40px;text-align:center;"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>`;

// ── Init ────────────────────────────────────────
initSidebar('dashboard');
setLastUpdated();
setGreeting();
setNextScan();

document.getElementById('btn-scan-top').addEventListener('click', function() {
  triggerScan(this);
});

loadDashboard();

// ── Functions ────────────────────────────────────
function statSkeleton(n) {
  return Array(n).fill('<div class="stat-card" style="opacity:.4;"><div class="stat-icon teal"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div><div><div class="stat-value">—</div><div class="stat-label">Cargando…</div></div></div>').join('');
}

async function loadDashboard() {
  try {
    const d = await api.stats();
    renderStats(d);
    renderChart(d.chart || []);
    renderRecent(d.recent || []);
  } catch (e) {
    document.getElementById('stats-grid').innerHTML =
      `<div style="grid-column:1/-1;" class="alert alert-err">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <div>Error cargando datos: ${e.message}</div>
      </div>`;
  }
}

function renderStats(d) {
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon teal">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div><div class="stat-value">${fmtNum(d.total)}</div><div class="stat-label">Total registradas</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div><div class="stat-value">${fmtNum(d.today)}</div><div class="stat-label">Detectadas hoy</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.48 2 2 0 0 1 3.62 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div><div class="stat-value">${fmtNum(d.emails)}</div><div class="stat-label">Correos enviados</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div><div class="stat-value">${fmtNum(d.active)}</div><div class="stat-label">Activas (publicadas)</div></div>
    </div>`;
}

function renderChart(data) {
  const ctx = document.getElementById('activity-chart');
  if (!ctx) return;
  const labels = data.map(r => {
    const d = new Date(r.date);
    return d.toLocaleDateString('es-CL', { day:'2-digit', month:'2-digit' });
  });
  const values = data.map(r => r.count);

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Licitaciones',
        data: values,
        borderColor: '#00C4D4',
        backgroundColor: (ctx) => {
          const gradient = ctx.chart.ctx.createLinearGradient(0, 0, 0, 200);
          gradient.addColorStop(0, 'rgba(0,196,212,.25)');
          gradient.addColorStop(1, 'rgba(0,196,212,.02)');
          return gradient;
        },
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: '#00C4D4',
        fill: true,
        tension: 0.4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#94A3B8', maxTicksLimit: 8 } },
        y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 }, color: '#94A3B8', precision: 0 }, beginAtZero: true }
      }
    }
  });
}

function renderRecent(rows) {
  const el = document.getElementById('recent-table');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Sin licitaciones aún</div><div class="empty-sub">Ejecuta un escaneo para comenzar</div></div>';
    return;
  }
  el.innerHTML = `
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Licitación</th>
          <th>Organismo</th>
          <th>Estado</th>
          <th>Palabras clave</th>
          <th>Fecha</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
          <tr>
            <td><a class="tbl-name" href="${r.link||'#'}" target="_blank">${r.nombre||'—'}</a></td>
            <td class="tbl-org">${r.organismo||'—'}</td>
            <td>${badgeHtml(r.estado)}</td>
            <td style="color:#64748B;font-size:12px;">${kwList(r.palabras_clave)}</td>
            <td style="color:#64748B;font-size:12px;white-space:nowrap;">${fmtDate(r.fecha_registro)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function setGreeting() {
  const h = new Date().getHours();
  const g = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const el = document.getElementById('greeting');
  if (el) el.textContent = g;
}

function setNextScan() {
  const now = new Date();
  const hours = [9, 13, 17];
  const day = now.getDay();
  const el = document.getElementById('next-scan');
  if (!el) return;

  if (day === 0 || day === 6) {
    el.textContent = 'Lunes 09:00 hrs.';
    return;
  }

  const cur = now.getHours() * 60 + now.getMinutes();
  const next = hours.find(h => h * 60 > cur);
  if (next) {
    el.textContent = `Hoy ${String(next).padStart(2,'0')}:00 hrs.`;
  } else {
    el.textContent = 'Mañana 09:00 hrs.';
  }
}

function onScanComplete() { loadDashboard(); }
</script>
</body>
</html>
