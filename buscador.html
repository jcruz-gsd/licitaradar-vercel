<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LicitaRadar — Buscador</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-root"></div>

<script src="/js/app.js"></script>
<script>
document.getElementById('app-root').innerHTML = `
<div class="app">
  ${sidebarHTML()}
  <div class="main">
    ${topbarHTML()}
    <div class="content">
      <div class="page-header">
        <div>
          <div class="page-title">Buscador</div>
          <div class="page-sub">Busca licitaciones por nombre, organismo o palabras clave</div>
        </div>
      </div>

      <div id="scan-alert" class="alert" style="display:none;"></div>

      <!-- Search hero -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-body">
          <div style="display:flex;gap:10px;align-items:center;">
            <div class="search-wrap" style="max-width:100%;flex:1;">
              <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" id="q" placeholder="Ej: software, notebook, soporte técnico…" autocomplete="off"
                style="font-size:15px;padding:12px 14px 12px 38px;">
            </div>
            <select class="filter-select" id="estado-filter" style="height:44px;">
              <option value="">Todos los estados</option>
              <option value="Publicada">Publicada</option>
              <option value="Cerrada">Cerrada</option>
              <option value="Adjudicada">Adjudicada</option>
              <option value="Evaluacion">En evaluación</option>
            </select>
            <button class="btn btn-primary" id="btn-buscar" style="height:44px;padding:0 24px;font-size:14px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Buscar
            </button>
          </div>

          <!-- Quick filters -->
          <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;">
            <span style="font-size:12px;color:#94A3B8;padding:4px 0;margin-right:4px;">Sugeridos:</span>
            ${['software','notebook','soporte técnico','ciberseguridad','infraestructura TI','licencias'].map(k =>
              `<button class="kw-tag" style="cursor:pointer;" onclick="quickSearch('${k}')">${k}</button>`).join('')}
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="card" id="results-card" style="display:none;">
        <div class="card-header">
          <span class="card-title" id="results-title">Resultados</span>
        </div>
        <div class="table-wrap" id="table-area"></div>
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- Empty start state -->
      <div id="start-state" class="empty" style="padding:80px 20px;">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Ingresa un término para buscar</div>
        <div class="empty-sub">Busca por nombre de licitación, organismo o palabras clave tecnológicas</div>
      </div>
    </div>
  </div>
</div>`;

initSidebar('buscador');
setLastUpdated();

let currentPage = 1;
const PER_PAGE  = 10;
let lastQuery   = '';

document.getElementById('btn-buscar').addEventListener('click', () => { currentPage = 1; doSearch(); });
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; doSearch(); } });

function quickSearch(kw) {
  document.getElementById('q').value = kw;
  currentPage = 1;
  doSearch();
}

async function doSearch() {
  const q      = document.getElementById('q').value.trim();
  const estado = document.getElementById('estado-filter').value;
  lastQuery    = q;

  document.getElementById('start-state').style.display  = 'none';
  document.getElementById('results-card').style.display = 'block';
  document.getElementById('table-area').innerHTML =
    '<div style="padding:50px;text-align:center;"><div class="spinner"></div></div>';

  try {
    const params = { page: currentPage, per_page: PER_PAGE };
    if (q)      params.q      = q;
    if (estado) params.estado = estado;

    const d = await api.licitaciones(params);
    document.getElementById('results-title').textContent =
      `${d.total || 0} resultado${(d.total||0) !== 1 ? 's' : ''}${q ? ` para "${q}"` : ''}`;
    renderTable(d.data || []);
    renderPagination(d.total || 0);
  } catch(e) {
    document.getElementById('table-area').innerHTML =
      `<div class="alert alert-err" style="margin:20px;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <div>Error: ${e.message}</div>
      </div>`;
  }
}

function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('table-area').innerHTML =
      '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Sin resultados</div><div class="empty-sub">Intenta con otras palabras clave</div></div>';
    return;
  }
  document.getElementById('table-area').innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th style="width:38%">Licitación</th>
        <th>Organismo</th>
        <th>Estado</th>
        <th>Palabras clave</th>
        <th>Fecha</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
        <tr>
          <td><a class="tbl-name" href="${r.link||'#'}" target="_blank">${highlight(r.nombre||'—', lastQuery)}</a>
              <small style="color:#94A3B8;font-size:11px;display:block;">${r.codigo_externo||''}</small></td>
          <td class="tbl-org">${highlight(r.organismo||'—', lastQuery)}</td>
          <td>${badgeHtml(r.estado)}</td>
          <td style="color:#64748B;font-size:12px;">${kwList(r.palabras_clave)}</td>
          <td style="color:#64748B;font-size:12px;white-space:nowrap;">${fmtDate(r.fecha_registro)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function highlight(text, q) {
  if (!q || !text) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark style="background:#fef9c3;padding:0 2px;border-radius:2px;">$1</mark>');
}

function renderPagination(total) {
  const pages = Math.ceil(total / PER_PAGE);
  const el    = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  let btns = `<button class="pg-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage-1})">‹</button>`;
  const start = Math.max(1, currentPage - 2);
  const end   = Math.min(pages, start + 4);
  for (let i = start; i <= end; i++) {
    btns += `<button class="pg-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  btns += `<button class="pg-btn" ${currentPage === pages ? 'disabled' : ''} onclick="goPage(${currentPage+1})">›</button>`;
  el.innerHTML = `<span class="page-info">Pág. ${currentPage} de ${pages}</span>${btns}`;
}

function goPage(p) { currentPage = p; doSearch(); window.scrollTo(0, 0); }
</script>
</body>
</html>
